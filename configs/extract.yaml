# Representation extraction and cache (protocol 3.1, 3.3).
models:
  - tag: pythia-160m
    hf_id: EleutherAI/pythia-160m-deduped
    revision: step143000
  - tag: gpt2
    hf_id: openai-community/gpt2
    revision: main
# Layer names:
#   L3, L6  -> hidden_states[3], hidden_states[6] (raw residual stream after block 3 / 6)
#   L12     -> output of the last block AFTER the final LayerNorm (what the LM predicts from; default)
#   L12raw  -> output of the last block BEFORE the final LayerNorm
layers: [L3, L6, L12, L12raw]
poolings: [mean, last]
splits: [train, dev, test]
batch_size: 128
max_length: 256
dtype: float16
determinism:
  split: dev                 # re-extracted with identical settings, compared to the cache
  max_abs_diff: 1.0e-3
  alt_batch_size: 32         # informational only: batch-size invariance
